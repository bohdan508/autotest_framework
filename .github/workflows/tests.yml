# Test workflow — runs the suite and publishes the latest Allure report to
# GitHub Pages

name: Tests

on:
  # Run the FULL suite when actual code changes (docs/README edits are ignored).
  # Deliberately a DENYLIST, not a list of code paths: an allowlist only matches
  # the directories it names, so a new top-level .py file — or a whole new
  # package — would silently skip the suite. Anything that isn't docs runs.

  # (Listed twice rather than via a YAML anchor: anchors are not a documented
  # GitHub Actions feature, and three duplicated lines beat an unguaranteed one.)
  push:
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - ".gitignore"
  pull_request:
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - ".gitignore"

  # Nightly: a fast smoke run to keep the report fresh and catch the
  # site breaking overnight. 03:00 UTC every day.
  # NOTE: GitHub disables scheduled workflows after 60 days of repo inactivity.
  schedule:
    - cron: "0 3 * * *"
  # A manual "Run workflow" button in the Actions tab.
  workflow_dispatch:

# The publish step pushes the report to the gh-pages branch, which needs write
# access to the repo contents.
permissions:
  contents: write

# Two runs finishing at once would both force-push an orphan gh-pages branch and
# race each other. Serialize them instead; don't cancel a run mid-publish.
concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # 1. Get the code.
      - uses: actions/checkout@v4

      # 2. Python 3.11, with pip's download cache reused between runs.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # 3. Install the test stack (requests, pytest, playwright, allure-pytest…).
      - run: pip install -r requirements.txt

      # 4. Install the Chromium browser Playwright drives (--with-deps pulls the
      #    system libraries it needs on Ubuntu). Only chromium — that's the default.
      - run: python -m playwright install --with-deps chromium

      # 5. Run the tests, writing Allure result files into allure-results/.
      #    Nightly (schedule) runs the fast smoke subset; every other trigger
      #    runs the full suite. continue-on-error: a red suite still lets the
      #    report publish below — step 10 then fails the job, so the check
      #    stays honest.
      - name: Run tests
        id: pytest
        continue-on-error: true
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            pytest -m smoke --alluredir=allure-results
          else
            pytest --alluredir=allure-results
          fi

      # 6. Allure's report generator is a Java tool so install a JRE
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 7. Install Allure command-line tool (shipped as npm package;
      #    Node is preinstalled on the runner).
      - run: npm install -g allure-commandline

      # 8. Turn the raw result files into a static HTML site in allure-report/.
      #    --clean wipes any previous output first. No history is merged in, so
      #    the report always reflects only this run.
      - run: allure generate allure-results --clean -o allure-report

      # 9. Publish that folder to the gh-pages branch. force_orphan keeps the
      #    branch to a single commit (latest report only — no growing history),
      #    which is exactly the "just the last result" behaviour we want.
      - name: Publish to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: allure-report
          force_orphan: true

      # 10. Now that the report is published, fail the job if the suite was red.
      #     Without this, continue-on-error above leaves the whole workflow green
      #     on failing tests. 'outcome' is the step's result BEFORE
      #     continue-on-error is applied, so it still sees the failure.
      - name: Reflect test result
        if: steps.pytest.outcome == 'failure'
        run: |
          echo "::error::Test suite failed — see the published Allure report."
          exit 1
