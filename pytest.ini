[pytest]
testpaths = tests

# --- run options ------------------------------------------------------------ #
# --strict-markers: an unregistered @pytest.mark.* becomes an error, not a warning.
# The playwright options capture failure diagnostics only (green runs stay fast):
#   tracing    -> Playwright trace (open with `playwright show-trace <zip>`)
#   screenshot -> PNG on failure
#   video      -> recording kept only for failed tests
addopts =
    --strict-markers
    --tracing=retain-on-failure
    --screenshot=only-on-failure
    --video=retain-on-failure

# --- custom markers --------------------------------------------------------- #
# Registered so pytest doesn't warn on unknown marks, and so `pytest --markers`
# documents them. Run a subset with e.g. `pytest -m smoke`.
markers =
    smoke: a small, fast subset that proves the core paths work

# --- logging ---------------------------------------------------------------- #
# The HTTP client emits an INFO line per request (see base_client._log_response);
# these settings route those records to the console (live) and to logs/run.log.

# live in the terminal while tests run
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s %(levelname)-8s %(name)s | %(message)s
log_cli_date_format = %H:%M:%S

# flat file, overwritten each run — the whole-run trace for debugging
log_file = logs/run.log
log_file_level = INFO
log_file_format = %(asctime)s %(levelname)-8s %(name)s | %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S
